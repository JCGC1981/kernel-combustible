<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kernel Energy · Control de Combustible</title>
  <meta name="theme-color" content="#001a7c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <img src="assets/logo-kernel.png" alt="Kernel Energy" class="logo">
      <h1>Control de consumo de combustible</h1>

      <div id="msg" class="alert" hidden></div>

      <!-- Inicio de sesión -->
      <form id="formLogin">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="username" inputmode="email" placeholder="usuario@kernelenergy.com">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" minlength="6">
        </div>
        <button type="submit" class="btn primary block big" id="btnLogin">Ingresar</button>
        <div class="center mt">
          <button type="button" class="link" id="btnReset">¿Olvidaste tu contraseña?</button>
        </div>
      </form>

      <!-- Definir nueva contraseña (invitación o recuperación) -->
      <form id="formNuevaClave" hidden>
        <p class="alert info">Define tu contraseña para ingresar a la aplicación.</p>
        <div class="field">
          <label for="clave1">Nueva contraseña</label>
          <input type="password" id="clave1" required minlength="6" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="clave2">Repite la contraseña</label>
          <input type="password" id="clave2" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn primary block big">Guardar y entrar</button>
      </form>

      <p class="muted small mt" id="version">Kernel Energy S.A.S.</p>
    </div>
  </main>

  <script>
    (async function () {
      if (window.KE_SIN_CONFIG) return;
      const { $, toast, getPerfil, mensajeError } = KE;
      const msg = $("#msg");
      const formLogin = $("#formLogin");
      const formClave = $("#formNuevaClave");

      // ¿Llegó desde un enlace de invitación / recuperación?
      const hash = location.hash || "";
      const flujoClave = /type=(invite|recovery|signup|magiclink)/.test(hash);
      let esperandoClave = flujoClave;

      function mostrar(texto, tipo = "error") {
        msg.textContent = texto; msg.className = `alert ${tipo}`; msg.hidden = !texto;
      }

      async function redirigirPorRol() {
        const perfil = await getPerfil();
        location.replace(perfil && perfil.rol === "admin" ? "admin.html" : "conductor.html");
      }

      sb.auth.onAuthStateChange(async (evento, session) => {
        if (evento === "PASSWORD_RECOVERY") esperandoClave = true;
        if (!session) return;
        if (esperandoClave) {
          formLogin.hidden = true; formClave.hidden = false;
        } else if (evento === "INITIAL_SESSION" || evento === "SIGNED_IN") {
          await redirigirPorRol();
        }
      });

      formLogin.addEventListener("submit", async (e) => {
        e.preventDefault();
        mostrar("");
        const btn = $("#btnLogin"); btn.disabled = true; btn.textContent = "Ingresando…";
        const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
        if (error) { mostrar(mensajeError(error)); btn.disabled = false; btn.textContent = "Ingresar"; return; }
        // onAuthStateChange se encarga de redirigir
      });

      $("#btnReset").addEventListener("click", async () => {
        const email = $("#email").value.trim();
        if (!email) { mostrar("Escribe tu correo y vuelve a presionar el enlace.", "warn"); return; }
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
        if (error) mostrar(mensajeError(error));
        else mostrar("Te enviamos un correo con el enlace para restablecer tu contraseña.", "info");
      });

      formClave.addEventListener("submit", async (e) => {
        e.preventDefault();
        const c1 = $("#clave1").value, c2 = $("#clave2").value;
        if (c1 !== c2) { mostrar("Las contraseñas no coinciden."); return; }
        const { error } = await sb.auth.updateUser({ password: c1 });
        if (error) { mostrar(mensajeError(error)); return; }
        toast("Contraseña guardada", "success");
        esperandoClave = false;
        history.replaceState(null, "", location.pathname);
        await redirigirPorRol();
      });
    })();
  </script>
</body>
</html>
